<head>
    <meta charset="UTF-8">

    <title>tijn.dev craft apps</title>
      <style>
        body {
        font-family: monospace;
        font-size: 1.25rem;
        background-color: #252525;
      }

      @media (min-width: 768px) {
        body {
          margin-block: 4vw;
          padding: 1rem;
        }
        ul {
          grid-template-columns: 1fr 1fr 1fr 1fr !important;
        }
      }

      * {
        margin: 0;
        padding: 0;
      }

      ul {
        list-style: none;
        margin: 0;
        margin-inline: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        max-width: 1280px;
        gap: 1px;
      }

      li {
        outline: 1px solid #444;
      }

      li > span {
        color: #ccc;
        padding: 0.5rem;
        display: block;
      }

      a {
        color: #ccc;
        background-color: #252525;
        text-decoration: none;
        display: flex;
        padding-bottom: 1rem;
        flex-direction: column;
        overflow: clip;

        .icon {
          height: 3rem;
          width: 3rem;
          margin-left: 1rem;
          margin-top: -1.5rem;
        }

        .icon,
        .hero {
          transition: scale 0.2s ease;

          transform-origin: bottom;
        }

        span {
          margin-left: 1rem;
          margin-top: 0.5rem;
        }

        .hero {
          width: 100%;
          object-fit: cover;
          height: 9rem;
          transform-origin: bottom;
        }

        &:hover {
          .icon {
            scale: 1.1;
          }

          .hero {
            scale: 1.1;
          }
        }
      }
  </style>
</head>
