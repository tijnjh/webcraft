<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>listing directory /</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/Invoca/backdraft/examples_server/css/index.css"
    />
  </head>

  <body class="directory">
    <input id="search" type="text" placeholder="Search" autocomplete="off" />
    <div id="wrapper">
      <h1><a href="/">~</a> /</h1>
      <ul id="files" class="view-tiles">
        {{ range . }}
        <li>
          <a
            href="https://{{ .Name }}.craft.tijn.dev/"
            class="icon icon-directory"
            title="{{ .Name }}craft"
          >
            <span class="name">{{ .Name }}craft {{ .Version }}</span>
            <span class="size"></span>
            <span class="date">{{ .Date }}</span>
          </a>
        </li>
        {{ end }}
      </ul>
    </div>

    <script>
      search.onkeyup = () => {
        const str = search.value.toLowerCase();
        files.querySelectorAll("a").forEach((link) => {
          const text = link.textContent.toLowerCase();
          if (text === "..") return;
          str.length && text.includes(str)
            ? link.classList.add("highlight")
            : link.classList.remove("highlight");
        });
      };
    </script>
  </body>
</html>
